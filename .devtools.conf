# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
APP_NAME=ezvpn
PROJECT_NAME=Ezvpn
SCHEME=Ezvpn
PRODUCT_NAME=ezvpn
# BUNDLE_ID intentionally unset: it is a per-developer xcconfig value
# (BUNDLE_ID_PREFIX); run-device reads it from the built app.

CORE_REPO=ezvpn
CORE_GH_REPO=flexaccessdev/ezvpn
CORE_BUILD_CMD="./build-apple.sh release"

XCFW_ASSET=libezvpn-apple.xcframework.zip
XCFW_PACKAGE_PATH=Packages/Ezvpn
LOCAL_XCFW_ENV=EZVPN_LOCAL_XCFRAMEWORK

# App + PacketTunnel extension both carry MARKETING_VERSION, synced to the
# core release tag (numeric part — Apple versions cannot carry prerelease).
BUMP_VERSION_MODE=marketing
MARKETING_VERSION_COUNT=2

OTA_APP_TITLE=Ezvpn
# No ci/ci.sh in this repo yet — mac-ci.sh is useful for --sync-only/--shell.
